<section style="font-family: Inter, system-ui, sans-serif; background:#f8fafc; padding:24px; max-width:420px; margin:0 auto; min-height:100vh;">
  <div style="background:white; border-radius:32px; padding:24px; box-shadow:0 20px 60px rgba(15,23,42,.08);">
    <h1 style="margin:0 0 18px; font-size:28px;">Tu pedido</h1>
    <article style="border-bottom:1px solid #e5e7eb; padding-bottom:16px;">
      <div style="display:flex; justify-content:space-between;">
        <strong>Hamburguesa clásica</strong>
        <strong>$9.500</strong>
      </div>
      <p style="color:#6b7280; font-size:14px;">Extras: Papas · Bacon</p>
      <div style="display:flex; gap:12px; align-items:center;">
        <button style="border:1px solid #e5e7eb; background:white; border-radius:50%; width:34px; height:34px;">−</button>
        <strong>1</strong>
        <button style="border:1px solid #e5e7eb; background:white; border-radius:50%; width:34px; height:34px;">+</button>
      </div>
    </article>
    <form style="display:grid; gap:12px; margin-top:18px;">
      <input placeholder="Tu nombre" style="border:1px solid #d1d5db; border-radius:16px; padding:14px;">
      <input placeholder="Tu teléfono" style="border:1px solid #d1d5db; border-radius:16px; padding:14px;">
      <select style="border:1px solid #d1d5db; border-radius:16px; padding:14px;">
        <option>Retiro</option>
        <option>Delivery</option>
      </select>
      <textarea placeholder="Notas" style="border:1px solid #d1d5db; border-radius:16px; padding:14px;"></textarea>
      <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:900;">
        <span>Total</span><span>$9.500</span>
      </div>
      <button style="border:0; border-radius:999px; background:#16a34a; color:white; padding:16px; font-weight:900;">Confirmar por WhatsApp</button>
    </form>
  </div>
</section>
