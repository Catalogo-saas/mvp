<section style="font-family: Inter, system-ui, sans-serif; background:#fff7ed; color:#111827; padding:24px; max-width:420px; margin:0 auto; min-height:100vh;">
  <header style="display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:rgba(255,247,237,.94); padding:12px 0;">
    <div style="display:flex; gap:12px; align-items:center;">
      <div style="width:44px; height:44px; border-radius:16px; background:#16a34a; color:white; display:grid; place-items:center; font-weight:900;">S</div>
      <div>
        <strong>Puro Sabor</strong>
        <p style="margin:2px 0 0; color:#6b7280; font-size:12px;">Pedido por WhatsApp</p>
      </div>
    </div>
    <button style="border:0; background:#111827; color:white; border-radius:999px; padding:12px 16px; font-weight:800;">Carrito 2</button>
  </header>

  <div style="background:#111827; color:white; border-radius:32px; padding:28px; margin-top:16px;">
    <p style="margin:0; color:rgba(255,255,255,.65); font-weight:800; font-size:13px;">Catálogo online</p>
    <h1 style="font-size:38px; line-height:1; margin:12px 0;">Comé rico, pedí simple.</h1>
    <p style="color:rgba(255,255,255,.72); line-height:1.55;">Elegí tus productos, sumá extras y confirmá por WhatsApp.</p>
  </div>

  <input placeholder="Buscar productos" style="width:100%; margin:18px 0 12px; border:1px solid #fed7aa; border-radius:18px; padding:15px; font-size:16px;">

  <nav style="display:flex; gap:8px; overflow:auto; padding-bottom:8px;">
    <button style="border:0; border-radius:999px; padding:10px 16px; background:#111827; color:white; font-weight:800;">Todo</button>
    <button style="border:0; border-radius:999px; padding:10px 16px; background:white; font-weight:800;">Hamburguesas</button>
    <button style="border:0; border-radius:999px; padding:10px 16px; background:white; font-weight:800;">Bebidas</button>
  </nav>

  <article style="background:white; border-radius:28px; overflow:hidden; margin-top:14px; box-shadow:0 16px 40px rgba(15,23,42,.08);">
    <div style="height:190px; background:linear-gradient(135deg,#fed7aa,#fb923c);"></div>
    <div style="padding:18px;">
      <p style="color:#16a34a; font-weight:900; letter-spacing:.12em; font-size:12px;">HAMBURGUESAS</p>
      <h2 style="margin:8px 0 4px;">Hamburguesa clásica</h2>
      <p style="color:#6b7280; line-height:1.5;">Pan brioche, cheddar, medallón y salsa de la casa.</p>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:20px;">$6.500</strong>
        <button style="border:0; background:#dcfce7; color:#166534; border-radius:999px; padding:10px 14px; font-weight:900;">Agregar</button>
      </div>
    </div>
  </article>

  <button style="position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:min(388px, calc(100% - 32px)); border:0; border-radius:999px; background:#111827; color:white; padding:16px 20px; font-weight:900; display:flex; justify-content:space-between;">
    <span>2 productos</span><span>$10.400</span>
  </button>
</section>
