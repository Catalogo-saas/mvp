<section style="font-family: Inter, system-ui, sans-serif; background:rgba(15,23,42,.08); padding:24px; max-width:420px; margin:0 auto; min-height:100vh; display:flex; align-items:end;">
  <div style="background:white; border-radius:32px; padding:24px; width:100%; box-shadow:0 30px 80px rgba(15,23,42,.22);">
    <div style="display:flex; justify-content:space-between; gap:16px;">
      <div>
        <h1 style="margin:0; font-size:26px;">Hamburguesa clásica</h1>
        <p style="color:#6b7280; line-height:1.45;">Elegí extras y personalizá tu pedido.</p>
      </div>
      <button style="border:0; background:#f3f4f6; border-radius:999px; width:40px; height:40px;">×</button>
    </div>

    <fieldset style="border:0; padding:0; margin:18px 0;">
      <legend style="font-weight:900;">Extras</legend>
      <label style="display:flex; justify-content:space-between; border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-top:10px;">
        <span><input type="checkbox"> Papas</span><strong>+$1.800</strong>
      </label>
      <label style="display:flex; justify-content:space-between; border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-top:10px;">
        <span><input type="checkbox"> Bacon</span><strong>+$1.200</strong>
      </label>
    </fieldset>

    <fieldset style="border:0; padding:0; margin:18px 0;">
      <legend style="font-weight:900;">Punto de cocción *</legend>
      <label style="display:block; border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-top:10px;"><input name="cook" type="radio"> Jugosa</label>
      <label style="display:block; border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-top:10px;"><input name="cook" type="radio"> A punto</label>
    </fieldset>

    <button style="width:100%; border:0; border-radius:999px; background:#16a34a; color:white; padding:16px; font-weight:900;">Agregar — $9.500</button>
  </div>
</section>
