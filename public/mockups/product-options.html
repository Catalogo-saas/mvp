<section style="font-family: Inter, system-ui, sans-serif; background:rgba(15,23,42,.12); color:#111827; padding:24px; min-height:100vh; display:flex; justify-content:center; align-items:start;">
  <div style="background:white; border-radius:28px; width:min(940px,100%); box-shadow:0 30px 90px rgba(15,23,42,.22); overflow:hidden;">
    <header style="display:flex; justify-content:space-between; align-items:center; gap:18px; padding:22px; border-bottom:1px solid #e5e7eb;">
      <div>
        <p style="color:#16a34a; font-size:12px; font-weight:900; letter-spacing:.18em; margin:0 0 8px;">EDITOR DE PRODUCTO</p>
        <h1 style="font-size:28px; margin:0;">Hamburguesa clasica</h1>
      </div>
      <button style="border:0; background:#f3f4f6; border-radius:999px; width:42px; height:42px; font-size:22px;">x</button>
    </header>

    <div style="display:grid; grid-template-columns:1fr 320px; gap:0;">
      <main style="padding:22px; display:grid; gap:16px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <input value="Hamburguesa clasica" style="border:1px solid #d1d5db; border-radius:14px; padding:13px;">
          <select style="border:1px solid #d1d5db; border-radius:14px; padding:13px;"><option>Hamburguesas</option></select>
        </div>
        <textarea style="border:1px solid #d1d5db; border-radius:14px; padding:13px; min-height:84px;">Pan brioche, cheddar, medallon y salsa de la casa.</textarea>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <label style="font-weight:800;">Precio base<input value="$6.500" style="display:block; width:100%; margin-top:8px; border:1px solid #d1d5db; border-radius:14px; padding:13px;"></label>
          <label style="font-weight:800;">Precio promocion<input value="$5.200" style="display:block; width:100%; margin-top:8px; border:1px solid #fecaca; border-radius:14px; padding:13px; color:#dc2626; font-weight:900;"></label>
        </div>

        <section style="border:1px solid #e5e7eb; border-radius:20px; padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-size:18px; margin:0;">Extras y variantes</h2>
            <button style="border:0; border-radius:999px; background:#111827; color:white; padding:10px 14px; font-weight:900;">+ Grupo</button>
          </div>

          <article style="border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-top:14px;">
            <div style="display:grid; grid-template-columns:1fr 130px 110px; gap:10px;">
              <input value="Extras" style="border:1px solid #d1d5db; border-radius:12px; padding:11px;">
              <select style="border:1px solid #d1d5db; border-radius:12px; padding:11px;"><option>Multiple</option></select>
              <label style="display:flex; align-items:center; gap:8px; font-weight:800;"><input type="checkbox"> Requerido</label>
            </div>
            <div style="display:grid; gap:8px; margin-top:12px;">
              <div style="display:grid; grid-template-columns:1fr 120px 90px; gap:8px;"><input value="Papas" style="border:1px solid #d1d5db; border-radius:12px; padding:10px;"><input value="+$1.800" style="border:1px solid #d1d5db; border-radius:12px; padding:10px;"><button style="border:1px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:12px;">Quitar</button></div>
              <div style="display:grid; grid-template-columns:1fr 120px 90px; gap:8px;"><input value="Bacon" style="border:1px solid #d1d5db; border-radius:12px; padding:10px;"><input value="+$1.200" style="border:1px solid #d1d5db; border-radius:12px; padding:10px;"><button style="border:1px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:12px;">Quitar</button></div>
            </div>
          </article>
        </section>
      </main>

      <aside style="background:#f8fafc; border-left:1px solid #e5e7eb; padding:22px;">
        <h2 style="font-size:18px; margin:0 0 14px;">Galeria</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div style="aspect-ratio:1; border-radius:18px; background:linear-gradient(135deg,#fed7aa,#fb923c); position:relative;"><span style="position:absolute; left:8px; top:8px; background:#111827; color:white; border-radius:999px; padding:4px 7px; font-size:11px; font-weight:900;">Portada</span></div>
          <div style="aspect-ratio:1; border-radius:18px; background:linear-gradient(135deg,#fde68a,#f59e0b);"></div>
          <div style="aspect-ratio:1; border-radius:18px; background:linear-gradient(135deg,#bfdbfe,#3b82f6);"></div>
          <button style="aspect-ratio:1; border:2px dashed #cbd5e1; background:white; border-radius:18px; font-weight:900; color:#64748b;">+ Subir</button>
        </div>
        <label style="display:flex; align-items:center; gap:10px; margin-top:18px; font-weight:900;"><input type="checkbox" checked> Visible en tienda</label>
        <button style="width:100%; border:0; border-radius:999px; background:#16a34a; color:white; padding:14px; font-weight:900; margin-top:20px;">Guardar producto</button>
      </aside>
    </div>
  </div>
</section>
